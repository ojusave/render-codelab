# Live Workshop Codelab — Render Blueprint (Web Service + Postgres)
# https://render.com/docs/blueprint-spec
#
# Apply: https://dashboard.render.com/blueprint/new?repo=https://github.com/ojusave/render-codelab
# Set TUTOR_PASSWORD when prompted. All other vars are defined below.

previews:
  generation: automatic

databases:
  - name: workshop-codelab-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: workshop_codelab
    user: workshop

services:
  - type: web
    name: workshop-codelab
    runtime: node
    plan: starter
    healthCheckPath: /healthz
    # Install devDependencies for Vite/tsc; run migrations via tsx in pre-deploy (no dist/cli dependency).
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npx tsx src/server/cli/migrate.ts && npx tsx src/server/cli/seed.ts
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: workshop-codelab-db
          property: connectionString
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: TUTOR_PASSWORD
        sync: false
      - key: VITE_GITHUB_REPO_URL
        value: https://github.com/ojusave/render-codelab
      - key: VITE_DEFAULT_SESSION_CODE
        value: cascadia-2026
      - key: SEED_SESSION_CODE
        value: cascadia-2026
